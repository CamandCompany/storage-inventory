<style>
:root{--bg:#e6eae7;--card:#fff;--tx:#15231b;--mut:#56655c;--ac:#1d6a47;--acx:#fff;--bd:#c9d2cc;--dg:#b3392f;--lid:#f2a541;--lid2:#d68a26;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111814;--card:#1a231e;--tx:#e8efea;--mut:#8fa095;--ac:#6cc59a;--acx:#0c2016;--bd:#2a3730;--dg:#e5776d;--lid:#f2a541;--lid2:#d68a26}}
:root[data-theme="dark"]{--bg:#111814;--card:#1a231e;--tx:#e8efea;--mut:#8fa095;--ac:#6cc59a;--acx:#0c2016;--bd:#2a3730;--dg:#e5776d;--lid:#f2a541;--lid2:#d68a26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;font-weight:700;font-size:1.65rem;line-height:1.08;margin:.9rem 0 .5rem}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
button{white-space:nowrap;font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.d{color:var(--dg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0;cursor:pointer}
.card h3{margin:0;font-size:1.05rem}
.mut{color:var(--mut);font-size:.9rem}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bd);flex:none}
.hero{width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin:8px 0}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}
.item .t{flex:1;min-width:0}
.item b{display:block;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto;display:grid;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0}.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer}.tile img,.tile .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bd)}.tile .ph{display:flex;align-items:center;justify-content:center;color:var(--mut)}.tile .c{padding:8px 10px}.tile b{display:block;overflow-wrap:anywhere}@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}.big{width:100%;max-height:50vh;object-fit:contain;border-radius:12px;background:var(--bd)}
.cat{width:64px;height:54px;flex:none;overflow:visible}
.cat .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.cat .earL{transform-box:fill-box;transform-origin:80% 100%;animation:twitch 7s infinite}
@keyframes twitch{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-10deg)}93%{transform:rotate(3deg)}}
.cat .head{transform-box:fill-box;transform-origin:50% 100%;animation:tilt 9s ease-in-out infinite}
@keyframes tilt{0%,30%,100%{transform:rotate(0)}45%,60%{transform:rotate(5deg)}}
@media(prefers-reduced-motion:reduce){.cat *{animation:none!important}}

/* ---- redesign: tote-lid header, label cards ---- */
.lidwrap{position:relative;margin:56px 0 14px}
.lidwrap .cat{position:absolute;right:16px;bottom:calc(100% - 22px);width:96px;height:auto;z-index:1}
.lidbar{position:relative;z-index:2;background:var(--lid);color:#2b1b05;border-radius:22px 22px 10px 10px;padding:16px 18px 24px;box-shadow:inset 0 -9px 0 var(--lid2)}
.lidbar::before{content:"";display:block;width:84px;height:9px;border-radius:5px;background:var(--lid2);margin-bottom:12px}
.lidbar h1{margin:0;color:#2b1b05}
.bar{display:flex;gap:8px;margin:0 0 8px}.bar input{flex:1;min-width:0}
button{border-radius:8px;min-height:44px;font-weight:500}
button.p{font-weight:600}
button:active{transform:translateY(1px)}
input,textarea{border-radius:8px;min-height:44px}
:focus-visible{outline:3px solid var(--lid2);outline-offset:2px}
.card{border-radius:10px;border-left:6px solid var(--lid);padding:14px 14px 14px 12px}
.card h3{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;font-size:1.25rem;font-weight:700;line-height:1.15}
.tile,.item,.hero{border-radius:10px}
.tile b,.item b{font-weight:600}
.msg{background:transparent;border:1px dashed var(--bd);color:var(--mut)}
.sheet{border-radius:16px 16px 0 0;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.label .n{font-family:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;font-weight:700;font-size:1.7rem}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.label{background:#fff;color:#000;border:1px dashed #999;padding:10px;text-align:center;border-radius:6px;break-inside:avoid}
.label svg{width:100%;max-width:170px;height:auto}
.label .n{font-size:1.5rem;font-weight:800}
.hide{display:none}
.msg{padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--bd);margin:8px 0}
@media print{body.pq main{display:none}body.pq .modal{position:static;background:none;display:block}body.pq .sheet{background:none;padding:0;max-height:none;overflow:visible}body{background:#fff}.noprint{display:none!important}main{max-width:none;padding:0}}
</style>
</head>
<body>
<main id="app"><p class="mut">Loading…</p></main>
<div id="modal"></div>
<script>
(function(){
var app=document.getElementById('app'),modal=document.getElementById('modal');
var selMode=false,sel={},bulkBusy=false,gridView=true,authed=false,sb=null,downloads=null,boxes=[],ready=false,q='',err='';
var base=location.origin+location.pathname;
var CAT='<svg class="cat" viewBox="-6 -4 212 176" aria-hidden="true"><g class="head"><g class="earL"><polygon points="36,84 46,14 92,54" fill="#857867"/><polygon points="49,70 53,33 80,56" fill="#d9a39f"/><path d="M46 16 q-4 -8 -6 -12 M50 20 q-2 -8 -2 -12" stroke="var(--mut)" stroke-width="1.6" fill="none" stroke-linecap="round"/></g><g class="earR"><polygon points="164,84 154,14 108,54" fill="#857867"/><polygon points="151,70 147,33 120,56" fill="#d9a39f"/><path d="M154 16 q4 -8 6 -12 M150 20 q2 -8 2 -12" stroke="var(--mut)" stroke-width="1.6" fill="none" stroke-linecap="round"/></g><ellipse cx="100" cy="104" rx="70" ry="56" fill="#857867"/><path d="M32 112 l-12 6 l12 4 l-10 8 l16 0 Z M168 112 l12 6 l-12 4 l10 8 l-16 0 Z" fill="#857867"/><ellipse cx="100" cy="130" rx="32" ry="24" fill="#d6cdbd"/><g stroke="#3b342e" stroke-width="5" stroke-linecap="round" fill="none"><path d="M100 50 v22"/><path d="M84 54 l4 20"/><path d="M116 54 l-4 20"/><path d="M34 98 l20 5"/><path d="M33 112 l20 2"/><path d="M166 98 l-20 5"/><path d="M167 112 l-20 2"/></g><g><ellipse cx="70" cy="98" rx="19" ry="18" fill="#2b2622"/><circle cx="70" cy="98" r="15.5" fill="#93b7b0"/><ellipse cx="70" cy="99" rx="7.5" ry="12" fill="#17130f"/><circle cx="75" cy="92" r="3.6" fill="#fff"/><ellipse class="lid" cx="70" cy="98" rx="20" ry="19" fill="#857867"/></g><g><ellipse cx="130" cy="98" rx="19" ry="18" fill="#2b2622"/><circle cx="130" cy="98" r="15.5" fill="#93b7b0"/><ellipse cx="130" cy="99" rx="7.5" ry="12" fill="#17130f"/><circle cx="135" cy="92" r="3.6" fill="#fff"/><ellipse class="lid" cx="130" cy="98" rx="20" ry="19" fill="#857867"/></g><path d="M92 121 h16 l-8 10 Z" fill="#d9928f"/><path d="M100 131 v5 M100 136 q-6 6 -13 2 M100 136 q6 6 13 2" stroke="#3b342e" stroke-width="2" fill="none" stroke-linecap="round"/><g stroke="var(--mut)" stroke-width="1.6" stroke-linecap="round" opacity=".9"><path d="M76 134 L8 124"/><path d="M76 138 L6 142"/><path d="M78 142 L14 158"/><path d="M124 134 L192 124"/><path d="M124 138 L194 142"/><path d="M122 142 L186 158"/></g></g></svg>';
var LID='<div class="lidwrap">'+CAT+'<header class="lidbar"><h1>Field Family ExtraSpace Storage Burbank Unit 895 Catalogue</h1></header></div>';
// Supabase project URL and public (anon) key. Safe to publish; data is protected by sign-in rules.
var SUPABASE_URL='https://slvwbngmnzqaiyrofqpj.supabase.co',SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsdndibmdtbnpxYWl5cm9mcXBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NTk4ODQsImV4cCI6MjExMDAzNTg4NH0._gVrSN56uxHpLtrnYZUyQpa5oQIEnMvF92G32xO57kQ';
// ===========================================================
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function img(id){return id?SUPABASE_URL+'/storage/v1/object/public/photos/'+id:''}
function uid(){return Math.random().toString(36).slice(2,7)}
function route(){var h=location.hash.slice(1);if(h==='labels')return{v:'labels'};if(h.indexOf('box-')===0)return{v:'box',id:h.slice(4).split(/[?&\/]/)[0]};return{v:'home'}}
function go(h){location.hash=h||'';}
function qrSvg(url){var qr=qrcode(0,'M');qr.addData(url);qr.make();return qr.createSvgTag({cellSize:4,margin:2,scalable:true})}

// ---------- data ----------
function fail(m){return function(e){err=m+(e&&e.message||e);render()}}
function saveBox(b){var d=Object.assign({},b),id=d.id;delete d.id;
 var i=boxes.findIndex(function(x){return x.id===id}),nb=Object.assign({},b);if(i<0)boxes.push(nb);else boxes[i]=nb;
 return sb.from('boxes').upsert({id:id,data:d}).then(function(r){if(r.error)throw r.error}).catch(fail('Could not save: '))}
function delBox(id){boxes=boxes.filter(function(x){return x.id!==id});return sb.from('boxes').delete().eq('id',id).then(function(r){if(r.error)throw r.error}).catch(fail('Could not delete: '))}
function load(){return sb.from('boxes').select('id,data').then(function(r){if(r.error)throw r.error;boxes=r.data.map(function(x){var o=Object.assign({},x.data);o.id=x.id;return o});ready=true;if(!modal.firstChild)render()}).catch(function(e){ready=true;err='Could not load: '+(e&&e.message||e);render()})}
function getBox(id){var k=String(id).toLowerCase();return boxes.find(function(b){return String(b.id).toLowerCase()===k})}

// ---------- photos ----------
function shrink(file){return new Promise(function(res,rej){
 var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
  var m=1400,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  c.toBlob(function(b){b?res(b):rej(new Error('encode failed'))},'image/jpeg',0.82)};im.src=r.result};r.readAsDataURL(file)})}
function upload(file){return shrink(file).then(function(b){var name=uid()+uid()+uid()+'.jpg';return sb.storage.from('photos').upload(name,b,{contentType:'image/jpeg',cacheControl:'31536000'}).then(function(r){if(r.error)throw r.error;return name})})}

// ---------- views ----------
function render(){
 var r=route();
 if(!authed)return;
 if(!ready){app.innerHTML='<p class="mut">Loading…</p>';return}
 var h=err?'<div class="msg" style="color:var(--dg)">'+esc(err)+'</div>':'';
 if(r.v==='labels')app.innerHTML=h+labelsView();
 else if(r.v==='box')app.innerHTML=h+boxView(r.id);
 else app.innerHTML=h+homeView();
 if(selMode&&r.v!=='labels')app.innerHTML+=selBar();
 bind();
}
function homeView(){
 var ql=q.trim().toLowerCase(),list=boxes.slice().sort(function(a,b){return(a.name||'').localeCompare(b.name||'',undefined,{numeric:true})});
 var out=LID+'<div class="bar"><input id="q" type="search" placeholder="Search all boxes" value="'+esc(q)+'">'+(boxes.length?'<button data-a="sel">'+(selMode?'Done':'Select')+'</button>':'')+'<button class="p" data-a="newbox">+ Box</button></div>';
 if(ql){
  var hits=[];list.forEach(function(b){(b.items||[]).forEach(function(it){if((it.name+' '+(it.note||'')).toLowerCase().indexOf(ql)>-1||(b.name||'').toLowerCase().indexOf(ql)>-1&&!hits.length&&false)hits.push({b:b,it:it})})});
  out+='<p class="mut">'+hits.length+' match'+(hits.length===1?'':'es')+'</p>';
  hits.forEach(function(h){out+='<div class="item" data-go="box-'+h.b.id+'" style="cursor:pointer">'+(h.it.photo?'<img class="thumb" src="'+img(h.it.photo)+'">':'')+'<div class="t"><b>'+esc(h.it.name)+'</b><span class="mut">in '+esc(h.b.name)+'</span>'+(h.it.out?'<span style="color:var(--dg);font-size:.85rem">● Checked out'+(h.it.outTo?' – '+esc(h.it.outTo):'')+'</span>':'')+'</div></div>'});
 } else {
  var outs=[];list.forEach(function(b){(b.items||[]).forEach(function(it){if(it.out)outs.push({b:b,it:it})})});
  if(outs.length){out+='<h3 style="margin:16px 0 4px">Checked out ('+outs.length+')</h3>';outs.forEach(function(h){out+='<div class="item" data-go="box-'+h.b.id+'" style="cursor:pointer"><div class="t"><b>'+esc(h.it.name)+'</b><span class="mut">from '+esc(h.b.name)+(h.it.outTo?' → '+esc(h.it.outTo):'')+'</span></div></div>'})}
  if(!list.length)out+='<div class="msg">No boxes yet. Tap <b>+ Box</b> to add your first one, then print its QR label.</div>';
  list.forEach(function(b){var n=(b.items||[]).length;out+='<div class="card" '+(selMode?'data-sel="'+b.id+'"':'data-go="box-'+b.id+'"')+'><div class="row">'+(selMode?'<span style="font-size:1.4rem">'+(sel[b.id]?'☑':'☐')+'</span>':'')+(b.photo?'<img class="thumb" src="'+img(b.photo)+'">':'')+'<div><h3>'+esc(b.name)+'</h3><span class="mut">'+n+' item'+(n===1?'':'s')+(b.location?' · '+esc(b.location):'')+'</span></div></div></div>'});
  if(list.length)out+='<p><button data-go="labels">Print QR labels</button> <button data-a="export">Export CSV</button> <button data-a="signout">Sign out</button></p>';
 }
 return out;
}
function boxView(id){
 var b=getBox(id);
 if(!b)return '<p><button data-go="">← All boxes</button></p><div class="msg">Box not found (looked for “'+esc(id)+'”; '+boxes.length+' box'+(boxes.length===1?'':'es')+' loaded).</div>';
 var items=b.items||[];
 var out='<div class="noprint row sp"><button data-go="">← All boxes</button><span class="row"><button data-a="qr">QR code</button><button data-a="editbox">Edit box</button></span></div><h1>'+esc(b.name)+'</h1>'+(b.location?'<div class="mut">'+esc(b.location)+'</div>':'')+(b.notes?'<p>'+esc(b.notes)+'</p>':'')+
 (b.photo?'<img class="hero" src="'+img(b.photo)+'" alt="Photo of box contents">':'')+
 '<div class="row sp"><b>'+items.length+' item'+(items.length===1?'':'s')+'</b><span class="row">'+(items.length?'<button data-a="sel">'+(selMode?'Done':'Select')+'</button>':'')+'<button data-a="view">'+(gridView?'List':'Photos')+'</button></span></div><div class="row" style="margin:8px 0"><button class="p" data-a="bulk" style="flex:1">📷 Add photos</button><button data-a="newitem" style="flex:1">+ Add one item</button></div><input id="bulk" type="file" accept="image/*" multiple class="hide">';
 if(!items.length)out+='<div class="msg">This box is empty. Tap Add photos to take or pick pictures of what is inside.</div>';
 var un=items.filter(function(x){return x.name==='Unnamed item'}).length;if(un)out+='<div class="msg">'+un+' unnamed. Tap a photo to give it a name.</div>';
 if(gridView&&items.length){out+='<div class="grid">';items.forEach(function(it,i){out+='<div class="tile" '+(selMode?'data-sel="'+ikey(it,i)+'" style="'+(sel[ikey(it,i)]?'outline:3px solid var(--ac)':'')+'"':'data-edit="'+i+'"')+'>'+(selMode?'<div style="padding:6px 10px;font-size:1.3rem">'+(sel[ikey(it,i)]?'☑':'☐')+'</div>':'')+(it.photo?'<img src="'+img(it.photo)+'" loading="lazy" decoding="async" alt="">':'<div class="ph">No photo</div>')+'<div class="c"><b>'+esc(it.name)+(it.qty>1?' ×'+it.qty:'')+'</b>'+(it.out?'<span style="color:var(--dg);font-size:.85rem">● Out'+(it.outTo?' – '+esc(it.outTo):'')+'</span>':(it.note?'<span class="mut">'+esc(it.note)+'</span>':''))+'</div></div>'});return out+'</div>'}
 items.forEach(function(it,i){out+='<div class="item" '+(selMode?'data-sel="'+ikey(it,i)+'"':'data-edit="'+i+'"')+' style="cursor:pointer">'+(selMode?'<span style="font-size:1.4rem">'+(sel[ikey(it,i)]?'☑':'☐')+'</span>':'')+(it.photo?'<img class="thumb" src="'+img(it.photo)+'">':'')+'<div class="t"><b>'+esc(it.name)+(it.qty>1?' <span class="mut">×'+it.qty+'</span>':'')+(it.out?' <span style="color:var(--dg);font-size:.85rem">● Out'+(it.outTo?' – '+esc(it.outTo):'')+'</span>':'')+'</b>'+(it.note?'<span class="mut">'+esc(it.note)+'</span>':'')+'</div></div>'});
 return out;
}
function labelsView(){
 var list=boxes.slice().sort(function(a,b){return(a.name||'').localeCompare(b.name||'',undefined,{numeric:true})});
 var out='<div class="noprint row sp"><button data-go="">← Back</button><button class="p" data-a="print">Print</button></div><h1 class="noprint">QR labels</h1><p class="mut noprint">Print one or two per box and cover with clear tape. Labels link to this page, so anyone scanning needs access to it.</p><div class="labels">';
 list.forEach(function(b){out+='<div class="label">'+qrSvg(base+'#box-'+b.id)+'<div class="n">'+esc(b.name)+'</div></div>'});
 return out+'</div>';
}

// ---------- events ----------
function bind(){
 var s=document.getElementById('q');
 if(s)s.oninput=function(){q=s.value;var p=s.selectionStart;render();var n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
 app.querySelectorAll('[data-go]').forEach(function(e){e.onclick=function(){go(e.getAttribute('data-go'))}});
 app.querySelectorAll('[data-a]').forEach(function(e){e.onclick=function(){act(e.getAttribute('data-a'))}});
 app.querySelectorAll('[data-edit]').forEach(function(e){e.onclick=function(){itemForm(+e.getAttribute('data-edit'))}});
 app.querySelectorAll('[data-sel]').forEach(function(e){e.onclick=function(){var k=e.getAttribute('data-sel');if(sel[k])delete sel[k];else sel[k]=1;render()}});
 var bk=document.getElementById('bulk');if(bk)bk.onchange=function(){bulkAdd(Array.prototype.slice.call(bk.files))};
}
function act(a){var r=route();
 if(a==='newbox')boxForm(null);
 else if(a==='editbox')boxForm(getBox(r.id));
 else if(a==='newitem')itemForm(-1);
 else if(a==='print')window.print();
 else if(a==='export')exportCsv();
 else if(a==='qr')qrSheet(getBox(r.id));
 else if(a==='view'){gridView=!gridView;render()}
 else if(a==='bulk')document.getElementById('bulk').click();
 else if(a==='sel'){selMode=!selMode;sel={};render()}
 else if(a==='delsel')delSelected();
 else if(a==='signout')sb.auth.signOut();
}
function closeM(){modal.innerHTML='';render()}
function sheet(html){modal.innerHTML='<div class="modal"><div class="sheet">'+html+'</div></div>';
 modal.querySelector('.modal').onclick=function(e){if(e.target.classList.contains('modal'))closeM()}}
function photoField(cur){return '<img id="pv" class="big '+(cur?'':'hide')+'" src="'+img(cur)+'" alt=""><label><span class="mut">Photo</span><input id="pf" type="file" accept="image/*"></label><div id="ps" class="mut"></div>'}
function wirePhoto(state){var f=document.getElementById('pf');if(!f)return;
 f.onchange=function(){var file=f.files[0];if(!file)return;var st=document.getElementById('ps');st.textContent='Uploading…';state.busy=true;
  upload(file).then(function(id){state.photo=id;state.busy=false;st.textContent='Photo added';var pv=document.getElementById('pv');pv.src=img(id);pv.classList.remove('hide')}).catch(function(e){state.busy=false;st.textContent='Upload failed: '+(e&&e.message||e)})}}

function qrSheet(b){if(!b)return;
 var u=base+'#box-'+b.id;
 sheet('<div class="label" id="ql">'+qrSvg(u)+'<div class="n">'+esc(b.name)+'</div></div><div class="row noprint"><button class="p" id="qp" style="flex:1">Print</button><button id="qx">Close</button></div><div class="mut noprint" style="overflow-wrap:anywhere">Opens: '+esc(u)+'</div>');
 document.getElementById('qx').onclick=closeM;
 document.getElementById('qp').onclick=function(){document.body.classList.add('pq');window.onafterprint=function(){document.body.classList.remove('pq')};window.print();setTimeout(function(){document.body.classList.remove('pq')},3000)}}

function ask(msg,yes,label){
 sheet('<p style="margin:0">'+esc(msg)+'</p><div class="row"><button class="d" id="ay" style="flex:1">'+(label||'Delete')+'</button><button id="an">Cancel</button></div>');
 document.getElementById('an').onclick=closeM;
 document.getElementById('ay').onclick=function(){modal.innerHTML='';yes()}}
function ikey(it,i){return it.id||('#'+i)}
function selBar(){var n=Object.keys(sel).length;return '<div class="noprint" style="position:sticky;bottom:0;padding:10px 0;background:var(--bg)"><div class="row"><button class="d" data-a="delsel" style="flex:1"'+(n?'':' disabled')+'>Delete selected ('+n+')</button><button data-a="sel">Cancel</button></div></div>'}
function delSelected(){
 var r=route(),keys=Object.keys(sel);if(!keys.length)return;
 var n=keys.length;ask(r.v==='box'?'Delete '+n+' item'+(n===1?'':'s')+' from this box?':'Delete '+n+' box'+(n===1?'':'es')+' and everything listed in '+(n===1?'it':'them')+'? Their printed QR codes will stop working.',function(){doDelete(r,keys)})}
function doDelete(r,keys){
 if(r.v==='box'){var b=getBox(r.id);if(!b)return;
  
  var nb=Object.assign({},b);nb.items=(b.items||[]).filter(function(it,i){return!sel[ikey(it,i)]});
  selMode=false;sel={};saveBox(nb).then(render)}
 else{
  
  selMode=false;sel={};Promise.all(keys.map(function(id){return delBox(id)})).then(render)}}
function putItem(items,ni,i){var k=items.findIndex(function(x){return x.id===ni.id});if(k<0&&i>=0)k=i;if(k>=0)items[k]=ni;else items.push(ni);return items}

function bulkAdd(files){
 if(bulkBusy||!files.length)return;bulkBusy=true;var id=route().id,ok=[],failed=0;err='';
 sheet('<h2 style="margin:0">Adding photos</h2><div id="bp" class="mut">Uploading 1 of '+files.length+'…</div>');
 function next(k){
  if(k>=files.length)return finish();
  var bp=document.getElementById('bp');if(bp)bp.textContent='Uploading '+(k+1)+' of '+files.length+'…';
  upload(files[k]).then(function(pid){ok.push(pid)}).catch(function(){failed++}).then(function(){next(k+1)})}
 function finish(){
  bulkBusy=false;var b=getBox(id);if(!b||!ok.length){err='Photos could not be uploaded.';return closeM()}
  var nb=Object.assign({},b);nb.items=(b.items||[]).concat(ok.map(function(pid){return{id:'i'+uid()+uid(),name:'Unnamed item',qty:1,note:'',photo:pid,out:false,outTo:''}}));
  saveBox(nb).then(function(){if(failed)err=failed+' photo'+(failed===1?'':'s')+' failed to upload.';closeM()})}
 next(0)}

function boxForm(b){
 var st={photo:b&&b.photo||'',nid:uid()+uid().slice(0,2),saving:false};
 sheet('<h2 style="margin:0">'+(b?'Edit box':'New box')+'</h2><input id="bn" placeholder="Box name (e.g. Box 7 – Camping)" value="'+esc(b&&b.name)+'"><input id="bl" placeholder="Location in unit (optional)" value="'+esc(b&&b.location)+'"><textarea id="bt" rows="2" placeholder="Notes (optional)">'+esc(b&&b.notes)+'</textarea>'+photoField(st.photo)+
 '<div class="row"><button class="p" id="ok" style="flex:1">Save</button><button id="cx">Cancel</button>'+(b?'<button class="d" id="rm">Delete</button>':'')+'</div>');
 wirePhoto(st);
 document.getElementById('cx').onclick=closeM;
 document.getElementById('ok').onclick=function(){
  if(st.busy||st.saving)return;var name=document.getElementById('bn').value.trim();if(!name){document.getElementById('bn').focus();return}
  var nb=b?Object.assign({},getBox(b.id)||b):{id:st.nid,items:[]};
  nb.name=name;nb.location=document.getElementById('bl').value.trim();nb.notes=document.getElementById('bt').value.trim();nb.photo=st.photo;st.saving=true;this.disabled=true;
  saveBox(nb).then(function(){closeM();if(!b){if(!getBox(nb.id))boxes.push(nb);go('box-'+nb.id)}})};
 var rm=document.getElementById('rm');
 if(rm)rm.onclick=function(){ask('Delete this box and its list? Its printed QR code will stop working.',function(){delBox(b.id);go('')})};
}
function itemForm(i){
 var b=getBox(route().id);if(!b)return;var it=i>=0?b.items[i]:null,st={photo:it&&it.photo||'',iid:(it&&it.id)||('i'+uid()+uid()),saving:false};
 sheet('<h2 style="margin:0">'+(it?'Edit item':'Add item')+'</h2><input id="in" placeholder="Item name" value="'+esc(it&&it.name)+'"><div class="row"><input id="iq" type="number" min="1" inputmode="numeric" placeholder="Qty" value="'+(it&&it.qty||1)+'" style="width:90px"><input id="io" placeholder="Note (optional)" value="'+esc(it&&it.note)+'"></div><label class="mut">Box<select id="ib" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit">'+boxes.map(function(x){return '<option value="'+x.id+'"'+(x.id===b.id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select></label><label class="row"><input type="checkbox" id="io2" style="width:auto"'+(it&&it.out?' checked':'')+'> Checked out</label><input id="ot" placeholder="Who has it / where it went" value="'+esc(it&&it.outTo)+'">'+photoField(st.photo)+
 '<div class="row"><button class="p" id="ok" style="flex:1">Save</button><button id="cx">Cancel</button>'+(it?'<button class="d" id="rm">Remove</button>':'')+'</div>');
 wirePhoto(st);
 document.getElementById('cx').onclick=closeM;
 document.getElementById('ok').onclick=function(){
  if(st.busy||st.saving)return;var name=document.getElementById('in').value.trim();if(!name){document.getElementById('in').focus();return}
  var cb=getBox(b.id)||b,nb=Object.assign({},cb);nb.items=(cb.items||[]).slice();st.saving=true;this.disabled=true;
  var ni={id:st.iid,name:name,qty:Math.max(1,parseInt(document.getElementById('iq').value,10)||1),note:document.getElementById('io').value.trim(),photo:st.photo,out:document.getElementById('io2').checked,outTo:document.getElementById('ot').value.trim()};
  var tid=document.getElementById('ib').value;
  if(tid!==b.id&&getBox(tid)){var tb=getBox(tid),tn=Object.assign({},tb);if(i>=0)nb.items.splice(i,1);tn.items=(tb.items||[]).concat([ni]);saveBox(tn)}
  else putItem(nb.items,ni,i);
  saveBox(nb).then(closeM)};
 var rm=document.getElementById('rm');
 if(rm)rm.onclick=function(){var nb=Object.assign({},b);nb.items=b.items.filter(function(_,k){return k!==i});saveBox(nb).then(closeM)};
}

function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(){
 if(!downloads){err='Export is not available in this view.';render();return}
 var rows=[['Box','Location','Item','Qty','Note','Checked out','Checked out to']];
 boxes.slice().sort(function(a,b){return(a.name||'').localeCompare(b.name||'',undefined,{numeric:true})}).forEach(function(b){var its=b.items||[];if(!its.length)rows.push([b.name,b.location||'','','','','','']);its.forEach(function(it){rows.push([b.name,b.location||'',it.name,it.qty||1,it.note||'',it.out?'Yes':'',it.outTo||''])})});
 downloads.save({filename:'storage-inventory.csv',data:'\ufeff'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n')}).catch(function(e){if(!e||e.code!=='dismissed'){err='Could not export: '+(e&&e.message||e);render()}})}

// ---------- boot ----------
window.addEventListener('hashchange',function(){selMode=false;sel={};closeM();render()});
downloads={save:function(o){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o.data],{type:'text/csv;charset=utf-8'}));a.download=o.filename;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}};
function loginView(msg){
 app.innerHTML=''+LID+'<p class="mut">Sign in to view and edit the inventory.</p><input id="em" type="email" placeholder="Email" autocomplete="username"><div style="height:8px"></div><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><p><button class="p" id="sg" style="width:100%">Sign in</button></p><p><button id="ml" style="width:100%">Email me a sign-in link instead</button></p>'+(msg?'<div class="msg">'+esc(msg)+'</div>':'');
 function em(){return document.getElementById('em').value.trim()}
 document.getElementById('sg').onclick=function(){var e=em(),pw=document.getElementById('pw').value;if(!e||!pw)return;
  sb.auth.signInWithPassword({email:e,password:pw}).then(function(r){if(r.error)loginView('Sign-in failed: '+r.error.message)})};
 document.getElementById('ml').onclick=function(){var e=em();if(!e)return;
  sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:base,shouldCreateUser:false}}).then(function(r){loginView(r.error?'Could not send link: '+r.error.message:'Check your email, then open the link on this device.')})}}
if(!window.supabase||SUPABASE_URL.indexOf('PASTE')===0){app.innerHTML='<div class="msg">Setup needed: add your Supabase project URL and key near the top of the script in index.html (see README.md).</div>'}
else{
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true}});
 sb.auth.onAuthStateChange(function(ev,session){
  if(session){var first=!authed;authed=true;if(first||ev==='SIGNED_IN'||ev==='TOKEN_REFRESHED'){if(first)render();load()}}
  else{authed=false;ready=false;boxes=[];loginView()}});
 document.addEventListener('visibilitychange',function(){if(!document.hidden&&authed&&!modal.firstChild)load()});
}
})();
</script>
</body>
</html>
